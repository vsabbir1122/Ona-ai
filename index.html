    <script>
      // Gracefully ignore harmless Vite HMR WebSocket errors in AI Studio iframe environment
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('vite'))) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('closed without opened'))) {
          e.preventDefault();
        }
      }, true);
    </script>
