<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background with squircle shape -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#glow)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Outer Neural Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glow)" stroke-width="8" stroke-dasharray="24 12" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Glowing Core Hexagon/Lotus -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Central AI Petals -->
    <path d="M0 -90 C40 -50, 60 0, 0 80 C-60 0, -40 -50, 0 -90 Z" fill="url(#glow)" fill-opacity="0.85"/>
    <path d="M-80 -20 C-40 -40, 20 -20, 70 30 C10 60, -50 40, -80 -20 Z" fill="url(#glow)" fill-opacity="0.7"/>
    <path d="M80 -20 C40 -40, -20 -20, -70 30 C-10 60, 50 40, 80 -20 Z" fill="url(#glow)" fill-opacity="0.7"/>
    
    <!-- Central Sparkle Core -->
    <circle cx="0" cy="0" r="28" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="18" fill="#06b6d4"/>
  </g>
  
  <!-- Bengali Ona Name Accent -->
  <text x="256" y="440" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="4">ONA AI</text>
</svg>
